name: Deploy docs

# Builds the docs and deploys them to https://toolsu.com/convnum/ as a Cloudflare Worker
# with static assets (docs/wrangler.jsonc). Needs the CLOUDFLARE_API_TOKEN secret: an API
# token with Account > Workers Scripts > Edit and Zone (toolsu.com) > Workers Routes > Edit.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig.json'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

concurrency:
  group: deploy-docs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # starlight-typedoc reads ../src with the library's tsconfig, so the library's own
      # dependencies are installed too.
      - name: Install library modules
        run: bun install --frozen-lockfile

      - name: Install docs modules
        working-directory: docs
        run: bun install --frozen-lockfile

      - name: Build docs
        working-directory: docs
        run: bun run build:pages

      - name: Deploy to Cloudflare
        working-directory: docs
        run: bunx wrangler@4.137.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
