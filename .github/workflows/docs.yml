# Requires: Pages "Build and deployment" Source set to "GitHub Actions" in the
# repository settings.
name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "CHANGELOG.md"
      - "README.md"
      - "typedoc.mjs"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install library deps
        run: bun install

      # The docs import the local library (via the `file:..` link), and
      # starlight-typedoc reads ../src — so build the library first.
      - name: Build library
        run: bun run build

      - name: Install docs deps
        run: cd docs && bun install

      - name: Build docs (Astro + Starlight)
        run: cd docs && bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
