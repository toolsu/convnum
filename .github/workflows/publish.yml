name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing: npm trades this job's OIDC token for a short-lived
      # credential, so no npm token is stored anywhere. Also signs provenance.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # Trusted publishing needs the npm CLI (11.5.1 or later), not `bun publish`.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install modules
        run: bun install

      # Gate publishing on the full check + typecheck + test suite, so a
      # manually pushed tag can never publish an unverified build.
      - name: Verify (format + lint + typecheck + tests)
        run: bun run checkall

      - name: Build package
        run: bun run build

      - name: Publish to npm
        run: npm publish --access public
